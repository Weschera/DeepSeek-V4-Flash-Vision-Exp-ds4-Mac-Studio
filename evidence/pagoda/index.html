<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌸 Pagoda Garden Voxel Art</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87CEEB;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-shadow: 1px 1px 3px #000;
            z-index: 100;
            background: rgba(30, 30, 40, .65);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, .25);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
        }
        #info span {
            color: #ffb0c0;
        }
    </style>
</head>
<body>
    <div id="info">🌸 <span>Pagoda Garden</span> — Drag to rotate · Scroll to zoom</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
    </script>

    <script>
        // ====== SCENE SETUP ======
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(28, 20, 28);
        camera.lookAt(0, 6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ====== CONTROLS ======
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 6, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI * 0.48;
        controls.minDistance = 8;
        controls.maxDistance = 70;
        controls.enablePan = true;

        // ====== LIGHTING ======
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e0, 0.85);
        sunLight.position.set(18, 30, 12);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 80;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x3a6b35, 0.45);
        scene.add(hemisphereLight);

        // ====== VOXEL DATA ======
        const voxelMap = new Map();

        function setVoxel(x, y, z, color) {
            const key = `${x},${y},${z}`;
            voxelMap.set(key, { x, y, z, color });
        }

        function hasVoxel(x, y, z) {
            return voxelMap.has(`${x},${y},${z}`);
        }

        // ====== GROUND ======
        for (let x = -30; x <= 30; x++) {
            for (let z = -30; z <= 30; z++) {
                const r = Math.random();
                let color;
                if (r < 0.05) {
                    color = 0x2a5a20;
                } else if (r < 0.15) {
                    color = 0x3a7a35;
                } else {
                    color = 0x2d5a27;
                }
                setVoxel(x, 0, z, color);
            }
        }

        // ====== PATH ======
        for (let x = -4; x <= 4; x++) {
            for (let z = -20; z <= 20; z++) {
                setVoxel(x, 0, z, 0x8b7355);
            }
        }

        // Path edges
        for (let x = -5; x <= 5; x++) {
            for (let z = -20; z <= 20; z++) {
                if (x === -5 || x === 5) {
                    setVoxel(x, 0, z, 0x7a6a50);
                }
            }
        }

        // ====== POND ======
        for (let x = 14; x <= 24; x++) {
            for (let z = -8; z <= 8; z++) {
                const depth = Math.floor(Math.random() * 2);
                setVoxel(x, 0, z, 0x1a5a8a);
                if (depth === 0) {
                    setVoxel(x, 0, z, 0x1e6a9a);
                }
            }
        }

        // Pond stone edge
        for (let x = 13; x <= 25; x++) {
            for (let z = -9; z <= 9; z++) {
                if (x === 13 || x === 25 || z === -9 || z === 9) {
                    setVoxel(x, 0, z, 0x7a7a7a);
                }
            }
        }

        // Lily pads
        setVoxel(16, 1, -3, 0x2d5a27);
        setVoxel(20, 1, 2, 0x2d5a27);
        setVoxel(18, 1, 4, 0x2d5a27);
        setVoxel(22, 1, -1, 0x2d5a27);

        // ====== BRIDGE ======
        for (let x = 14; x <= 24; x++) {
            for (let z = -2; z <= 2; z++) {
                setVoxel(x, 1, z, 0x8b7355);
            }
        }
        // Bridge rails
        for (let x = 14; x <= 24; x++) {
            setVoxel(x, 2, -2, 0x6a5a40);
            setVoxel(x, 2, 2, 0x6a5a40);
        }

        // ====== PAGODA ======
        function createPagoda(cx, cz, baseY) {
            // Base platform
            for (let x = -5; x <= 5; x++) {
                for (let z = -5; z <= 5; z++) {
                    setVoxel(cx + x, baseY, cz + z, 0x8b7355);
                }
            }

            // Tier 1
            for (let x = -3; x <= 3; x++) {
                for (let z = -3; z <= 3; z++) {
                    if (Math.abs(x) === 3 || Math.abs(z) === 3) {
                        // Red columns
                        setVoxel(cx + x, baseY + 1, cz + z, 0xcc6633);
                        setVoxel(cx + x, baseY + 2, cz + z, 0xcc6633);
                        setVoxel(cx + x, baseY + 3, cz + z, 0xcc6633);
                    } else {
                        // White walls
                        if (x === 0 && z === 3) {
                            // Door
                            setVoxel(cx + x, baseY + 1, cz + z, 0x8b7355);
                            setVoxel(cx + x, baseY + 2, cz + z, 0x8b7355);
                        } else {
                            setVoxel(cx + x, baseY + 1, cz + z, 0xf0e8d0);
                            setVoxel(cx + x, baseY + 2, cz + z, 0xf0e8d0);
                        }
                    }
                }
            }

            // Tier 1 roof
            for (let x = -4; x <= 4; x++) {
                for (let z = -4; z <= 4; z++) {
                    if (Math.abs(x) === 4 || Math.abs(z) === 4) {
                        setVoxel(cx + x, baseY + 4, cz + z, 0x4a2a0a);
                    } else {
                        setVoxel(cx + x, baseY + 4, cz + z, 0x5a3a1a);
                    }
                }
            }
            // Upturned corners
            setVoxel(cx - 4, baseY + 5, cz - 4, 0x4a2a0a);
            setVoxel(cx + 4, baseY + 5, cz - 4, 0x4a2a0a);
            setVoxel(cx - 4, baseY + 5, cz + 4, 0x4a2a0a);
            setVoxel(cx + 4, baseY + 5, cz + 4, 0x4a2a0a);
            // Golden accents on roof corners
            setVoxel(cx - 4, baseY + 4, cz - 4, 0xffcc00);
            setVoxel(cx + 4, baseY + 4, cz - 4, 0xffcc00);
            setVoxel(cx - 4, baseY + 4, cz + 4, 0xffcc00);
            setVoxel(cx + 4, baseY + 4, cz + 4, 0xffcc00);

            // Tier 2
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    if (Math.abs(x) === 2 || Math.abs(z) === 2) {
                        setVoxel(cx + x, baseY + 5, cz + z, 0xcc6633);
                        setVoxel(cx + x, baseY + 6, cz + z, 0xcc6633);
                        setVoxel(cx + x, baseY + 7, cz + z, 0xcc6633);
                    } else {
                        setVoxel(cx + x, baseY + 5, cz + z, 0xf0e8d0);
                        setVoxel(cx + x, baseY + 6, cz + z, 0xf0e8d0);
                    }
                }
            }

            // Tier 2 roof
            for (let x = -3; x <= 3; x++) {
                for (let z = -3; z <= 3; z++) {
                    if (Math.abs(x) === 3 || Math.abs(z) === 3) {
                        setVoxel(cx + x, baseY + 8, cz + z, 0x4a2a0a);
                    } else {
                        setVoxel(cx + x, baseY + 8, cz + z, 0x5a3a1a);
                    }
                }
            }
            // Upturned corners
            setVoxel(cx - 3, baseY + 9, cz - 3, 0x4a2a0a);
            setVoxel(cx + 3, baseY + 9, cz - 3, 0x4a2a0a);
            setVoxel(cx - 3, baseY + 9, cz + 3, 0x4a2a0a);
            setVoxel(cx + 3, baseY + 9, cz + 3, 0x4a2a0a);
            // Golden accents
            setVoxel(cx - 3, baseY + 8, cz - 3, 0xffcc00);
            setVoxel(cx + 3, baseY + 8, cz - 3, 0xffcc00);
            setVoxel(cx - 3, baseY + 8, cz + 3, 0xffcc00);
            setVoxel(cx + 3, baseY + 8, cz + 3, 0xffcc00);

            // Tier 3
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    if (Math.abs(x) === 1 || Math.abs(z) === 1) {
                        setVoxel(cx + x, baseY + 9, cz + z, 0xcc6633);
                        setVoxel(cx + x, baseY + 10, cz + z, 0xcc6633);
                    } else {
                        setVoxel(cx + x, baseY + 9, cz + z, 0xf0e8d0);
                    }
                }
            }

            // Tier 3 roof
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    if (Math.abs(x) === 2 || Math.abs(z) === 2) {
                        setVoxel(cx + x, baseY + 11, cz + z, 0x4a2a0a);
                    } else {
                        setVoxel(cx + x, baseY + 11, cz + z, 0x5a3a1a);
                    }
                }
            }
            // Upturned corners
            setVoxel(cx - 2, baseY + 12, cz - 2, 0x4a2a0a);
            setVoxel(cx + 2, baseY + 12, cz - 2, 0x4a2a0a);
            setVoxel(cx - 2, baseY + 12, cz + 2, 0x4a2a0a);
            setVoxel(cx + 2, baseY + 12, cz + 2, 0x4a2a0a);
            // Golden accents
            setVoxel(cx - 2, baseY + 11, cz - 2, 0xffcc00);
            setVoxel(cx + 2, baseY + 11, cz - 2, 0xffcc00);
            setVoxel(cx - 2, baseY + 11, cz + 2, 0xffcc00);
            setVoxel(cx + 2, baseY + 11, cz + 2, 0xffcc00);

            // Spire
            setVoxel(cx, baseY + 13, cz, 0xffcc00);
            setVoxel(cx, baseY + 14, cz, 0xffcc00);
            setVoxel(cx, baseY + 15, cz, 0xffcc00);
            setVoxel(cx, baseY + 16, cz, 0xffaa00);
        }

        createPagoda(0, 0, 1);

        // ====== CHERRY BLOSSOM TREES ======
        function createCherryBlossomTree(cx, cz, baseY) {
            // Trunk
            setVoxel(cx, baseY, cz, 0x4a2a0a);
            setVoxel(cx, baseY + 1, cz, 0x4a2a0a);
            setVoxel(cx, baseY + 2, cz, 0x4a2a0a);
            // Branches
            setVoxel(cx + 1, baseY + 2, cz, 0x4a2a0a);
            setVoxel(cx - 1, baseY + 2, cz, 0x4a2a0a);
            setVoxel(cx, baseY + 2, cz + 1, 0x4a2a0a);
            setVoxel(cx, baseY + 2, cz - 1, 0x4a2a0a);

            // Canopy
            for (let dx = -2; dx <= 2; dx++) {
                for (let dy = -1; dy <= 2; dy++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        if (dist <= 2.5) {
                            const blossomColor = (dx + dz + dy) % 2 === 0 ? 0xffb0c0 : 0xff8a9a;
                            setVoxel(cx + dx, baseY + 3 + dy, cz + dz, blossomColor);
                        }
                    }
                }
            }
            // Extra blossoms on top
            setVoxel(cx, baseY + 5, cz, 0xffb0c0);
            setVoxel(cx + 1, baseY + 5, cz, 0xff8a9a);
            setVoxel(cx - 1, baseY + 5, cz, 0xffb0c0);
            setVoxel(cx, baseY + 5, cz + 1, 0xff8a9a);
            setVoxel(cx, baseY + 5, cz - 1, 0xffb0c0);
        }

        // ====== GREEN TREES ======
        function createGreenTree(cx, cz, baseY) {
            // Trunk
            setVoxel(cx, baseY, cz, 0x4a2a0a);
            setVoxel(cx, baseY + 1, cz, 0x4a2a0a);
            setVoxel(cx, baseY + 2, cz, 0x4a2a0a);
            // Branches
            setVoxel(cx + 1, baseY + 2, cz, 0x4a2a0a);
            setVoxel(cx - 1, baseY + 2, cz, 0x4a2a0a);

            // Canopy
            for (let dx = -2; dx <= 2; dx++) {
                for (let dy = -1; dy <= 2; dy++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        if (dist <= 2.5) {
                            const leafColor = (dx + dz + dy) % 2 === 0 ? 0x2d5a27 : 0x3a6b35;
                            setVoxel(cx + dx, baseY + 3 + dy, cz + dz, leafColor);
                        }
                    }
                }
            }
        }

        // Place cherry blossom trees
        createCherryBlossomTree(-10, 5, 1);
        createCherryBlossomTree(-8, -8, 1);
        createCherryBlossomTree(10, 10, 1);
        createCherryBlossomTree(8, -5, 1);
        createCherryBlossomTree(-12, 12, 1);

        // Place green trees
        createGreenTree(-15, 10, 1);
        createGreenTree(15, -10, 1);
        createGreenTree(-12, -15, 1);
        createGreenTree(20, 5, 1);
        createGreenTree(-20, -5, 1);
        createGreenTree(22, -12, 1);

        // ====== STONE LANTERNS ======
        function createStoneLantern(cx, cz, baseY) {
            setVoxel(cx, baseY, cz, 0x7a7a7a);
            setVoxel(cx, baseY + 1, cz, 0x7a7a7a);
            setVoxel(cx, baseY + 2, cz, 0x7a7a7a);
            setVoxel(cx, baseY + 3, cz, 0xffcc00);
            setVoxel(cx, baseY + 4, cz, 0x7a7a7a);
            setVoxel(cx + 1, baseY + 4, cz, 0x7a7a7a);
            setVoxel(cx - 1, baseY + 4, cz, 0x7a7a7a);
            setVoxel(cx, baseY + 4, cz + 1, 0x7a7a7a);
            setVoxel(cx, baseY + 4, cz - 1, 0x7a7a7a);
        }

        createStoneLantern(-6, 6, 1);
        createStoneLantern(6, -6, 1);
        createStoneLantern(-6, -6, 1);
        createStoneLantern(7, 7, 1);

        // ====== FLOWERS ======
        const flowerColors = [0xff69b4, 0xff4500, 0xffd700, 0xff1493, 0xffa07a, 0xff6a80];
        for (let i = 0; i < 40; i++) {
            const x = Math.floor(Math.random() * 44) - 22;
            const z = Math.floor(Math.random() * 44) - 22;
            // Skip path
            if (x >= -5 && x <= 5 && z >= -20 && z <= 20) continue;
            // Skip pond
            if (x >= 13 && x <= 25 && z >= -9 && z <= 9) continue;
            // Skip pagoda base
            if (x >= -6 && x <= 6 && z >= -6 && z <= 6) continue;
            const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
            setVoxel(x, 1, z, color);
        }

        // ====== ROCKS ======
        function createRock(cx, cz, baseY) {
            setVoxel(cx, baseY, cz, 0x7a7a7a);
            setVoxel(cx + 1, baseY, cz, 0x7a7a7a);
            setVoxel(cx, baseY, cz + 1, 0x7a7a7a);
            setVoxel(cx, baseY + 1, cz, 0x7a7a7a);
            setVoxel(cx + 1, baseY + 1, cz, 0x6a6a6a);
        }

        createRock(-18, 3, 1);
        createRock(18, -3, 1);
        createRock(-14, -12, 1);
        createRock(22, 8, 1);
        createRock(-22, 15, 1);

        // ====== CHERRY BLOSSOM PETALS ======
        const petalPositions = [
            [-9, 1, 5],
            [-10, 1, 6],
            [-8, 1, 4],
            [-7, 1, -7],
            [-9, 1, -8],
            [9, 1, 10],
            [11, 1, 9],
            [7, 1, -4],
            [9, 1, -5],
            [-11, 1, 4],
            [-8, 1, 7],
            [10, 1, 11],
            [8, 1, -6],
            [-6, 1, -9],
        ];
        for (const [x, y, z] of petalPositions) {
            setVoxel(x, y, z, 0xffb0c0);
        }

        // ====== FENCE ======
        // Simple fence posts
        for (let i = -24; i <= 24; i += 4) {
            setVoxel(i, 1, -28, 0x8b7355);
            setVoxel(i, 2, -28, 0x8b7355);
            setVoxel(i, 1, 28, 0x8b7355);
            setVoxel(i, 2, 28, 0x8b7355);
            setVoxel(-28, 1, i, 0x8b7355);
            setVoxel(-28, 2, i, 0x8b7355);
            setVoxel(28, 1, i, 0x8b7355);
            setVoxel(28, 2, i, 0x8b7355);
        }

        // ====== CLOUDS ======
        const cloudPositions = [
            [-15, 22, -10],
            [10, 24, 15],
            [-5, 26, 20],
            [20, 20, -15],
            [-20, 28, 5],
        ];
        for (const [cx, cy, cz] of cloudPositions) {
            for (let dx = -3; dx <= 3; dx++) {
                for (let dz = -2; dz <= 2; dz++) {
                    setVoxel(cx + dx, cy, cz + dz, 0xffffff);
                }
            }
            // Cloud top
            setVoxel(cx, cy + 1, cz, 0xffffff);
            setVoxel(cx + 1, cy + 1, cz, 0xffffff);
            setVoxel(cx - 1, cy + 1, cz, 0xffffff);
        }

        // ====== BUILD VOXEL MESH ======
        const voxelData = [];
        for (const [key, value] of voxelMap) {
            voxelData.push(value);
        }

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true });
        const mesh = new THREE.InstancedMesh(geometry, material, voxelData.length);

        const dummyMatrix = new THREE.Matrix4();
        const dummyColor = new THREE.Color();

        for (let i = 0; i < voxelData.length; i++) {
            const v = voxelData[i];
            dummyMatrix.makeTranslation(v.x, v.y, v.z);
            mesh.setMatrixAt(i, dummyMatrix);
            dummyColor.setHex(v.color);
            mesh.setColorAt(i, dummyColor);
        }

        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        scene.add(mesh);

        // ====== ANIMATION ======
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ====== RESIZE ======
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // ====== START ======
        animate();
    </script>
</body>
</html>
